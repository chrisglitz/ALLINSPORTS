version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: allinsports-postgres
    environment:
      POSTGRES_USER: allinsports
      POSTGRES_PASSWORD: development
      POSTGRES_DB: allinsports
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: allinsports-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
